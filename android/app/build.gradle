// Records that the WHOLE unit-test suite passed on a clean checkout of the current commit. scripts/release-android.ps1 reads the
// record and does not repeat the tests for that exact commit; anything else (dirty tree, other commit, --tests filter, failure) leaves
// no record, so the script runs them itself. The record goes to the git directory shared by all worktrees, so a run in a task
// worktree still counts after the branch is fast-forwarded into homemusic.
tasks.register("recordHomeMusicTestsPassed") {
    doLast {
        def test = tasks.getByName("testHomemusicDebugUnitTest")
        def state = test.state
        def ranOrUnchanged = state.failure == null &&
                ((state.executed && !state.skipped) || state.skipMessage in ["UP-TO-DATE", "FROM-CACHE"])
        def unfiltered = test.filter.includePatterns.isEmpty() && test.filter.commandLineIncludePatterns.isEmpty()
        if (!ranOrUnchanged || !unfiltered) return
        def git = { String... args ->
            def process = new ProcessBuilder(["git", "-C", rootProject.projectDir.absolutePath] + args.toList()).redirectErrorStream(true).start()
            def output = process.inputStream.text.trim()
            if (process.waitFor() != 0) throw new GradleException("git ${args.join(' ')} failed: $output")
            output
        }
        if (!git("status", "--porcelain", "--untracked-files=normal").isEmpty()) return
        def head = git("rev-parse", "HEAD")
        def common = new File(git("rev-parse", "--git-common-dir"))
        if (!common.absolute) common = new File(rootProject.projectDir, common.path)
        def dir = new File(common, "homemusic-tests-passed")
        dir.mkdirs()
        new File(dir, head).text = "passed ${new Date().format('yyyy-MM-dd HH:mm:ss')}\n"
    }
}
tasks.configureEach { task ->
    if (task.name == "testHomemusicDebugUnitTest") task.finalizedBy("recordHomeMusicTestsPassed")
}

// One-shot HomeMusic release: reserve the next patch, invoke an isolated Gradle build with explicit version properties,
// then give the signed universal APK its versioned filename. Ordinary assemble tasks never touch release-version.txt.
tasks.register('releaseHomemusicRelease') {
    group = 'release'
    description = 'Builds the next versioned, signed HomeMusic release APK and advances release-version.txt.'
    doLast {
        def versionFile = rootProject.file('release-version.txt')
        if (!versionFile.exists()) throw new GradleException("Missing release counter: ${versionFile}")
        def channel = java.nio.channels.FileChannel.open(versionFile.toPath(),
                java.nio.file.StandardOpenOption.READ, java.nio.file.StandardOpenOption.WRITE)
        def lock = channel.lock()
        String version
        int nextPatch
        try {
            channel.position(0)
            def buffer = java.nio.ByteBuffer.allocate((int) channel.size())
            while (buffer.hasRemaining() && channel.read(buffer) != -1) { }
            buffer.flip()
            def currentText = java.nio.charset.StandardCharsets.UTF_8.decode(buffer).toString().trim()
            if (!(currentText ==~ /\d+/)) throw new GradleException("Invalid patch counter in ${versionFile}: '${currentText}'")
            int patch = Integer.parseInt(currentText)
            if (patch < 0 || patch >= 1000) throw new GradleException('Patch counter must be between 0 and 999.')
            version = "1.0.${patch}"
            nextPatch = patch + 1
            def updated = java.nio.ByteBuffer.wrap("${nextPatch}\n".getBytes(java.nio.charset.StandardCharsets.UTF_8))
            channel.truncate(0)
            channel.position(0)
            while (updated.hasRemaining()) channel.write(updated)
            channel.force(true)
        } finally {
            lock.release()
            channel.close()
        }

        int patch = Integer.parseInt(version.substring(version.lastIndexOf('.') + 1))
        int versionCode = 1 * 100000 + 0 * 1000 + patch * 10
        def windows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
        def command = windows ? ['cmd.exe', '/c', 'gradlew.bat'] : ['./gradlew']
        command.addAll([':app:assembleHomemusicRelease', "-PreleaseVersion=${version}", "-PreleaseVersionCode=${versionCode}"])
        def processBuilder = new ProcessBuilder().directory(rootProject.projectDir).redirectErrorStream(true)
        command.each { processBuilder.command().add(it.toString()) }
        def process = processBuilder.start()
        process.inputStream.withReader('UTF-8') { reader -> reader.eachLine { println(it) } }
        int exitCode = process.waitFor()
        if (exitCode != 0) throw new GradleException("Nested HomeMusic release build failed with exit code ${exitCode}; reserved version ${version} remains consumed.")

        def apkDir = project.file('build/outputs/apk/homemusic/release')
        def candidates = apkDir.listFiles()?.findAll { it.name.startsWith('app-homemusic') && it.name.endsWith('-release.apk') } ?: []
        def source = candidates.find { it.name == 'app-homemusic-universal-release.apk' } ?: candidates.find { it.name == 'app-homemusic-release.apk' }
        if (source == null) throw new GradleException("Could not find the HomeMusic release APK in ${apkDir}; found: ${candidates*.name}")
        def target = new File(apkDir, "app-homemusic-release-${version}.apk")
        if (target.exists() && !target.delete()) throw new GradleException("Could not replace ${target}")
        if (!source.renameTo(target)) throw new GradleException("Could not rename ${source} to ${target}")
        logger.lifecycle("Versioned HomeMusic APK: ${target}")
    }
}

// Passes Room's -Aroom.schemaLocation so that the build cache key depends on the schema files and their relative paths,
// not on where the project is checked out. Without it a release built in a task worktree could not be reused from the main
// checkout: javac missed the cache, and R8, lint and packaging missed after it.
class RoomSchemaArgs implements CommandLineArgumentProvider {
    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    final File dir

    RoomSchemaArgs(File dir) { this.dir = dir }

    @Override
    Iterable<String> asArguments() { ["-Aroom.schemaLocation=${dir.path}".toString()] }
}
